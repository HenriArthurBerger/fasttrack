    - NS TDI MekI
    - DMI TDI MekI
    - ROSI TDI MekI
    - NS TDI MekI Palbo
    - DMI TDI MekI Palbo
    - ROSI TDI MekI Palbo
  - name: MekI
    conditions:
    - NS
    - DMI
    - ROSI
    - NS MekI
    - DMI MekI
    - ROSI MekI
    - NS TDI MekI
    - DMI TDI MekI
    - ROSI TDI MekI
  - name: MekI Palbo
    conditions:
    - NS
    - DMI
    - ROSI
    - NS MekI Palbo
    - DMI MekI Palbo
    - ROSI MekI Palbo
    - NS TDI MekI Palbo
    - DMI TDI MekI Palbo
    - ROSI TDI MekI Palbo
  gates:
  - name: H2B high
    metric:
      measure: nuc_mean
      channel: H2B
      over_measure: ''
      over_channel: ''
      background_percentile: 0.0
      log2: true
      smooth: 0
    threshold: 10.0
    above: true
  - name: PPARY high
    metric:
      measure: nuc_mean
      channel: PPARY
      over_measure: ''
      over_channel: ''
      background_percentile: 0.0
      log2: true
      smooth: 0
    threshold: 12.25
    above: true
  - name: Geminin high
    metric:
      measure: nuc_mean
      channel: Geminin
      over_measure: ''
      over_channel: ''
      background_percentile: 0.0
      log2: true
      smooth: 0
    threshold: 8.5
    above: true
