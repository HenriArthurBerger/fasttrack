# FastTrack experiment, saved 2026-11-05 18:12. Every setting is written out so a rerun gives the same result.
fasttrack_version: 0.1.0
experiment:
  name: 2023-08-11 NS DMI ROSI x MekI x Palbo x TDI
  notes: Converted from Config/0811_All_Batches.yaml. Set the raw data folder before tracking. Thresholds are log2 values
    as in the notebook. plothist / make_graphs / background_removal from the old file are replaced by the figure list below.
paths:
  raw: ''
  results: /Volumes/Aokigahara/Henri_Data/2023-08-11_NS_DMI_ROSI_NS_M_MP_T_TM_TMP_tracked
files:
  pattern: (?P<well>[A-H]\d{2})_Time(?P<t>\d+)_xy(?P<pos>\d+)c(?P<chan>\d+)\.tiff?$
  first_frame: 0
  last_frame: 350
  stride: 1
  io_threads: 16
channels:
- file_channel: 1
  name: H2B
  role: nuclear
  reporter: ''
  color: '#2d63e5'
- file_channel: 2
  name: PPARY
  role: measure
  reporter: ''
  color: '#cc3d3d'
- file_channel: 3
  name: Geminin
  role: measure
  reporter: ''
  color: '#3a9e4f'
time:
  frames_per_hour: 0.0
  events:
  - name: DMI addition
    frame: 0
    color: '#444444'
