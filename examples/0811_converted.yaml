  excluded_wells: []
  excluded_positions: []
pipeline:
  device: cuda:0
  batch_size: 100
  batch_auto: true
  batch_max: 500
  vram_fraction: 0.75
  prefetch_batches: 1
  seed: 0
  background:
    tiles_per_edge: 21
    tile_quantile: 0.01
    scale_quantile: 0.02
    chunk_frames: 25
  mask:
    tiles_per_edge: 21
    rough_std: 5.0
    foreground_quantile: 0.01
    background_quantile: 0.98
    threshold_scale: 0.6
    log_sigma: 2.0
    log_kernel: 11
  centroids:
    method: notebook
    blur_sigma: 1.5
    seed_overlap: 1.75
    cnn_checkpoint: ''
    cnn_threshold: 0.35
  measure:
    subsections: 7
    even_median: lower
  underseg:
    enabled: true
    min_child_area_frac: 0.2
    kmeans_iters: 6
    max_rounds: 25
  link:
    method: multipass
    correct_shift: true
    min_shift: 3
    max_travel: 0.0
    max_travel_factor: 2.0
    max_travel_floor: 15.0
    move_weight: 5.0
    division: true
    division_mass_tol: 0.7
    division_sister_tol: 1.0
    division_net_count: true
    division_radius: 25.0
    max_gap: 3
    gap_penalty: 0.5
    cleanup_cost_quantile: 0.995
    history: 5
    feature_clip: 6.0
    distance_weight: 1.0
    max_cost: 8.0
    assignment: lsa
    lsa_max_cells: 1000
    division_distance: 35.0
  output:
    save_measurements: true
    overwrite: false
    gui_cache_layers:
    - binary_mask
    - label_map
analysis:
  min_track_frames: 30
  drop_border: true
  groups:
  - name: All
    conditions:
    - NS
    - DMI
    - ROSI
    - NS MekI
    - DMI MekI
    - ROSI MekI
    - NS MekI Palbo
    - DMI MekI Palbo
    - ROSI MekI Palbo
    - NS TDI
