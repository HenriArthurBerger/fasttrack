[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fasttrack"
version = "0.1.0"
description = "GPU-native segmentation, measurement and lineage tracking for terabyte-scale timelapse fluorescence microscopy."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.2", "numpy", "scipy", "tifffile", "pillow", "h5py", "pyyaml"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
learned = ["torchvision"]
analysis = ["matplotlib", "pandas"]
dev = ["pytest"]

[project.scripts]
fasttrack = "fasttrack.cli:main"

[tool.setuptools.packages.find]
include = ["fasttrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device"]
